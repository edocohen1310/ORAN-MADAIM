<div id="cap0" class="clip cap" data-start="1.067" data-duration="2.333" data-track-index="1"><span id="cap0-t" class="cap-t">דמיינו שאתם קצינים צעירים.</span></div>
<div id="cap1" class="clip cap" data-start="3.400" data-duration="1.633" data-track-index="1"><span id="cap1-t" class="cap-t">קיבלתם חמישים חיילים,</span></div>
<div id="cap2" class="clip cap" data-start="5.033" data-duration="1.500" data-track-index="1"><span id="cap2-t" class="cap-t">ופקודה אחת פשוטה:</span></div>
<div id="cap3" class="clip cap" data-start="6.533" data-duration="1.567" data-track-index="1"><span id="cap3-t" class="cap-t">לשמור על מעבר בנהר,</span></div>
<div id="cap4" class="clip cap" data-start="8.100" data-duration="1.167" data-track-index="1"><span id="cap4-t" class="cap-t">בכל מחיר.</span></div>
<div id="cap5" class="clip cap" data-start="9.267" data-duration="1.733" data-track-index="1"><span id="cap5-t" class="cap-t">נשמע קל?</span></div>
<div id="cap6" class="clip cap" data-start="11.000" data-duration="2.667" data-track-index="1"><span id="cap6-t" class="cap-t">הקצין שלנו ינסה את זה שש פעמים.</span></div>
<div id="cap7" class="clip cap" data-start="13.667" data-duration="2.500" data-track-index="1"><span id="cap7-t" class="cap-t">חמש פעמים הוא ייכשל.</span></div>
<div id="cap8" class="clip cap" data-start="16.167" data-duration="1.267" data-track-index="1"><span id="cap8-t" class="cap-t">ובכל כישלון,</span></div>
<div id="cap9" class="clip cap" data-start="17.433" data-duration="1.733" data-track-index="1"><span id="cap9-t" class="cap-t">הוא ילמד משהו חדש.</span></div>
<div id="cap10" class="clip cap" data-start="19.167" data-duration="3.233" data-track-index="1"><span id="cap10-t" class="cap-t">זה הסיפור של הספר ״הגנת מעברות פתיים״.</span></div>
<div id="cap11" class="clip cap" data-start="25.567" data-duration="2.067" data-track-index="1"><span id="cap11-t" class="cap-t">את הספר כתב קצין בריטי,</span></div>
<div id="cap12" class="clip cap" data-start="27.633" data-duration="1.667" data-track-index="1"><span id="cap12-t" class="cap-t">סר ארנסט סווינטון,</span></div>
<div id="cap13" class="clip cap" data-start="29.300" data-duration="2.533" data-track-index="1"><span id="cap13-t" class="cap-t">שלחם במלחמת הבורים בדרום אפריקה.</span></div>
<div id="cap14" class="clip cap" data-start="31.833" data-duration="5.667" data-track-index="1"><span id="cap14-t" class="cap-t">המלחמה הזו נמשכה בין 1899 לבין 1902.</span></div>
<div id="cap15" class="clip cap" data-start="37.500" data-duration="1.033" data-track-index="1"><span id="cap15-t" class="cap-t">מצד אחד,</span></div>
<div id="cap16" class="clip cap" data-start="38.533" data-duration="1.367" data-track-index="1"><span id="cap16-t" class="cap-t">האימפריה הבריטית,</span></div>
<div id="cap17" class="clip cap" data-start="39.900" data-duration="1.400" data-track-index="1"><span id="cap17-t" class="cap-t">הגדולה בעולם.</span></div>
<div id="cap18" class="clip cap" data-start="41.300" data-duration="1.067" data-track-index="1"><span id="cap18-t" class="cap-t">ומצד שני,</span></div>
<div id="cap19" class="clip cap" data-start="42.367" data-duration="2.600" data-track-index="1"><span id="cap19-t" class="cap-t">הבורים: חקלאים ממוצא הולנדי,</span></div>
<div id="cap20" class="clip cap" data-start="44.967" data-duration="1.700" data-track-index="1"><span id="cap20-t" class="cap-t">שלחמו רכובים על סוסים,</span></div>
<div id="cap21" class="clip cap" data-start="46.667" data-duration="2.833" data-track-index="1"><span id="cap21-t" class="cap-t">בקבוצות קטנות וזריזות שנקראו ״קומנדו״.</span></div>
<div id="cap22" class="clip cap" data-start="49.500" data-duration="2.200" data-track-index="1"><span id="cap22-t" class="cap-t">הם הכירו כל גבעה וכל ערוץ,</span></div>
<div id="cap23" class="clip cap" data-start="51.700" data-duration="2.433" data-track-index="1"><span id="cap23-t" class="cap-t">והפתיעו שוב ושוב את הצבא הבריטי.</span></div>
<div id="cap24" class="clip cap" data-start="54.133" data-duration="2.433" data-track-index="1"><span id="cap24-t" class="cap-t">סווינטון ראה במלחמה הרבה טעויות של</span></div>
<div id="cap25" class="clip cap" data-start="56.567" data-duration="1.767" data-track-index="1"><span id="cap25-t" class="cap-t">קצינים צעירים.</span></div>
<div id="cap26" class="clip cap" data-start="58.333" data-duration="1.633" data-track-index="1"><span id="cap26-t" class="cap-t">אז הוא כתב עליהן סיפור,</span></div>
<div id="cap27" class="clip cap" data-start="59.967" data-duration="1.800" data-track-index="1"><span id="cap27-t" class="cap-t">וחתם בשם עט משעשע:</span></div>
<div id="cap28" class="clip cap" data-start="61.767" data-duration="1.533" data-track-index="1"><span id="cap28-t" class="cap-t">״חכם-לאחר-מעשה״.</span></div>
<div id="cap29" class="clip cap" data-start="63.300" data-duration="2.400" data-track-index="1"><span id="cap29-t" class="cap-t">אגב, סווינטון היה אחד האנשים שפיתחו</span></div>
<div id="cap30" class="clip cap" data-start="65.700" data-duration="1.200" data-track-index="1"><span id="cap30-t" class="cap-t">את הטנק הראשון,</span></div>
<div id="cap31" class="clip cap" data-start="66.900" data-duration="3.333" data-track-index="1"><span id="cap31-t" class="cap-t">ואחר כך גם פרופסור להיסטוריה צבאית באוקספורד.</span></div>
<div id="cap32" class="clip cap" data-start="70.233" data-duration="2.233" data-track-index="1"><span id="cap32-t" class="cap-t">בעברית הספר יצא כבר ב-1952,</span></div>
<div id="cap33" class="clip cap" data-start="72.467" data-duration="3.867" data-track-index="1"><span id="cap33-t" class="cap-t">ומפקדים בצה״ל לומדים ממנו עד היום.</span></div>
<div id="cap34" class="clip cap" data-start="76.333" data-duration="2.100" data-track-index="1"><span id="cap34-t" class="cap-t">והטריק של הספר?</span></div>
<div id="cap35" class="clip cap" data-start="78.433" data-duration="1.767" data-track-index="1"><span id="cap35-t" class="cap-t">הכול קורה בחלומות.</span></div>
<div id="cap36" class="clip cap" data-start="80.200" data-duration="1.833" data-track-index="1"><span id="cap36-t" class="cap-t">הקצין חולם את אותו קרב שש</span></div>
<div id="cap37" class="clip cap" data-start="82.033" data-duration="3.367" data-track-index="1"><span id="cap37-t" class="cap-t">פעמים. בכל חלום הוא מתחיל מאפס,</span></div>
<div id="cap38" class="clip cap" data-start="85.400" data-duration="2.067" data-track-index="1"><span id="cap38-t" class="cap-t">אבל זוכר את השיעורים שלמד.</span></div>
<div id="cap39" class="clip cap" data-start="89.000" data-duration="1.800" data-track-index="1"><span id="cap39-t" class="cap-t">בואו נכיר את השטח.</span></div>
<div id="cap40" class="clip cap" data-start="90.800" data-duration="1.667" data-track-index="1"><span id="cap40-t" class="cap-t">זה הנהר.</span></div>
<div id="cap41" class="clip cap" data-start="92.467" data-duration="1.733" data-track-index="1"><span id="cap41-t" class="cap-t">בקיץ הוא כמעט יבש,</span></div>
<div id="cap42" class="clip cap" data-start="94.200" data-duration="1.567" data-track-index="1"><span id="cap42-t" class="cap-t">אבל הגדות שלו גבוהות,</span></div>
<div id="cap43" class="clip cap" data-start="95.767" data-duration="1.900" data-track-index="1"><span id="cap43-t" class="cap-t">תלולות ומכוסות שיחים.</span></div>
<div id="cap44" class="clip cap" data-start="97.667" data-duration="1.800" data-track-index="1"><span id="cap44-t" class="cap-t">יש רק מקום אחד שבו עגלות</span></div>
<div id="cap45" class="clip cap" data-start="99.467" data-duration="1.300" data-track-index="1"><span id="cap45-t" class="cap-t">יכולות לחצות אותו:</span></div>
<div id="cap46" class="clip cap" data-start="100.767" data-duration="2.967" data-track-index="1"><span id="cap46-t" class="cap-t">המעבר. מעברות פתיים.</span></div>
<div id="cap47" class="clip cap" data-start="103.733" data-duration="2.533" data-track-index="1"><span id="cap47-t" class="cap-t">דרומית למעבר מתרוממת גבעה סלעית,</span></div>
<div id="cap48" class="clip cap" data-start="106.267" data-duration="2.733" data-track-index="1"><span id="cap48-t" class="cap-t">ועל ראשה כפר קטן של מקומיים.</span></div>
<div id="cap49" class="clip cap" data-start="109.000" data-duration="2.100" data-track-index="1"><span id="cap49-t" class="cap-t">קוראים לה ״גבעת המכשלה״.</span></div>
<div id="cap50" class="clip cap" data-start="111.100" data-duration="2.000" data-track-index="1"><span id="cap50-t" class="cap-t">מצפון לנהר נמצאת החווה של איכר</span></div>
<div id="cap51" class="clip cap" data-start="113.100" data-duration="1.300" data-track-index="1"><span id="cap51-t" class="cap-t">בורי בשם ברינק,</span></div>
<div id="cap52" class="clip cap" data-start="114.400" data-duration="2.267" data-track-index="1"><span id="cap52-t" class="cap-t">ליד גבעה שנקראת ״תל-פגע״.</span></div>
<div id="cap53" class="clip cap" data-start="116.667" data-duration="1.633" data-track-index="1"><span id="cap53-t" class="cap-t">ורחוק יותר בצפון,</span></div>
<div id="cap54" class="clip cap" data-start="118.300" data-duration="1.100" data-track-index="1"><span id="cap54-t" class="cap-t">הר שטוח:</span></div>
<div id="cap55" class="clip cap" data-start="119.400" data-duration="1.233" data-track-index="1"><span id="cap55-t" class="cap-t">״הר החרטות״.</span></div>
<div id="cap56" class="clip cap" data-start="120.633" data-duration="2.933" data-track-index="1"><span id="cap56-t" class="cap-t">והפקודה: להחזיק את המעבר בכל מחיר,</span></div>
<div id="cap57" class="clip cap" data-start="123.567" data-duration="1.967" data-track-index="1"><span id="cap57-t" class="cap-t">עד שתגיע שיירה צבאית גדולה,</span></div>
<div id="cap58" class="clip cap" data-start="125.533" data-duration="2.100" data-track-index="1"><span id="cap58-t" class="cap-t">בעוד שלושה או ארבעה ימים.</span></div>
<div id="cap59" class="clip cap" data-start="127.633" data-duration="1.267" data-track-index="1"><span id="cap59-t" class="cap-t">לפי המודיעין,</span></div>
<div id="cap60" class="clip cap" data-start="128.900" data-duration="2.333" data-track-index="1"><span id="cap60-t" class="cap-t">האויב רחוק מאה מיילים.</span></div>
<div id="cap61" class="clip cap" data-start="131.233" data-duration="1.933" data-track-index="1"><span id="cap61-t" class="cap-t">אז מה כבר יכול לקרות?</span></div>
<div id="cap62" class="clip cap" data-start="139.833" data-duration="2.067" data-track-index="1"><span id="cap62-t" class="cap-t">הסגן מגיע אחר הצהריים,</span></div>
<div id="cap63" class="clip cap" data-start="141.900" data-duration="1.833" data-track-index="1"><span id="cap63-t" class="cap-t">עייף מהדרך.</span></div>
<div id="cap64" class="clip cap" data-start="143.733" data-duration="1.833" data-track-index="1"><span id="cap64-t" class="cap-t">הוא בוחר מקום נוח למחנה:</span></div>
<div id="cap65" class="clip cap" data-start="145.567" data-duration="1.467" data-track-index="1"><span id="cap65-t" class="cap-t">ממש ליד המעבר,</span></div>
<div id="cap66" class="clip cap" data-start="147.033" data-duration="1.200" data-track-index="1"><span id="cap66-t" class="cap-t">קרוב למים.</span></div>
<div id="cap67" class="clip cap" data-start="148.233" data-duration="1.533" data-track-index="1"><span id="cap67-t" class="cap-t">החיילים מקימים אוהלים,</span></div>
<div id="cap68" class="clip cap" data-start="149.767" data-duration="1.500" data-track-index="1"><span id="cap68-t" class="cap-t">מבשלים ארוחת ערב,</span></div>
<div id="cap69" class="clip cap" data-start="151.267" data-duration="2.933" data-track-index="1"><span id="cap69-t" class="cap-t">ומחליטים: ״את החפירות נעשה מחר״.</span></div>
<div id="cap70" class="clip cap" data-start="154.200" data-duration="1.467" data-track-index="1"><span id="cap70-t" class="cap-t">בערב מגיע אורח:</span></div>
<div id="cap71" class="clip cap" data-start="155.667" data-duration="1.133" data-track-index="1"><span id="cap71-t" class="cap-t">האיכר ברינק,</span></div>
<div id="cap72" class="clip cap" data-start="156.800" data-duration="1.267" data-track-index="1"><span id="cap72-t" class="cap-t">איש זקן וחביב,</span></div>
<div id="cap73" class="clip cap" data-start="158.067" data-duration="1.733" data-track-index="1"><span id="cap73-t" class="cap-t">עם שני בניו.</span></div>
<div id="cap74" class="clip cap" data-start="159.800" data-duration="2.267" data-track-index="1"><span id="cap74-t" class="cap-t">הם מוכרים לחיילים חלב וביצים,</span></div>
<div id="cap75" class="clip cap" data-start="162.067" data-duration="1.967" data-track-index="1"><span id="cap75-t" class="cap-t">ומסתובבים בכל המחנה.</span></div>

<div id="cap183" class="clip cap" data-start="481.233" data-duration="2.100" data-track-index="1"><span id="cap183-t" class="cap-t">את הנשים והילדים הוא מסתיר בערוץ</span></div>
<div id="cap184" class="clip cap" data-start="483.333" data-duration="1.233" data-track-index="1"><span id="cap184-t" class="cap-t">קטן מאחור.</span></div>
<div id="cap185" class="clip cap" data-start="484.567" data-duration="2.133" data-track-index="1"><span id="cap185-t" class="cap-t">בבוקר האויב מופיע מצפון,</span></div>
<div id="cap186" class="clip cap" data-start="486.700" data-duration="2.533" data-track-index="1"><span id="cap186-t" class="cap-t">בדיוק כמו בחלום הקודם.</span></div>
<div id="cap187" class="clip cap" data-start="489.233" data-duration="2.000" data-track-index="1"><span id="cap187-t" class="cap-t">הסגן מחכה שיתקרבו.</span></div>
<div id="cap188" class="clip cap" data-start="491.233" data-duration="2.367" data-track-index="1"><span id="cap188-t" class="cap-t">אבל אז משהו משתבש.</span></div>
<div id="cap189" class="clip cap" data-start="493.600" data-duration="2.700" data-track-index="1"><span id="cap189-t" class="cap-t">חלק מהבורים מקיפים את החפירה מהצד,</span></div>
<div id="cap190" class="clip cap" data-start="496.300" data-duration="2.233" data-track-index="1"><span id="cap190-t" class="cap-t">וזוחלים לתוך הערוץ שמאחור.</span></div>
<div id="cap191" class="clip cap" data-start="498.533" data-duration="2.500" data-track-index="1"><span id="cap191-t" class="cap-t">עכשיו יורים עליהם מהגב.</span></div>
<div id="cap192" class="clip cap" data-start="501.033" data-duration="2.433" data-track-index="1"><span id="cap192-t" class="cap-t">והחפירה, קו ישר וארוך,</span></div>
<div id="cap193" class="clip cap" data-start="503.467" data-duration="2.467" data-track-index="1"><span id="cap193-t" class="cap-t">פגיעה במיוחד לאש מהצד.</span></div>
<div id="cap194" class="clip cap" data-start="505.933" data-duration="1.800" data-track-index="1"><span id="cap194-t" class="cap-t">כדור שנכנס מהקצה</span></div>
<div id="cap195" class="clip cap" data-start="507.733" data-duration="2.200" data-track-index="1"><span id="cap195-t" class="cap-t">עובר לאורך כל השורה.</span></div>
<div id="cap196" class="clip cap" data-start="509.933" data-duration="1.233" data-track-index="1"><span id="cap196-t" class="cap-t">לזה קוראים:</span></div>
<div id="cap197" class="clip cap" data-start="511.167" data-duration="1.167" data-track-index="1"><span id="cap197-t" class="cap-t">״אש אנפילדית״.</span></div>
<div id="cap198" class="clip cap" data-start="512.333" data-duration="3.800" data-track-index="1"><span id="cap198-t" class="cap-t">הבעיה? החפירה פנתה רק לכיוון אחד,</span></div>
<div id="cap199" class="clip cap" data-start="516.133" data-duration="2.700" data-track-index="1"><span id="cap199-t" class="cap-t">צפונה. והסגן שכח,</span></div>
<div id="cap200" class="clip cap" data-start="518.833" data-duration="2.233" data-track-index="1"><span id="cap200-t" class="cap-t">שאויב יכול להגיע מכל צד.</span></div>
<div id="cap201" class="clip cap" data-start="521.067" data-duration="1.700" data-track-index="1"><span id="cap201-t" class="cap-t">שוב תבוסה.</span></div>
<div id="cap202" class="clip cap" data-start="522.767" data-duration="2.633" data-track-index="1"><span id="cap202-t" class="cap-t">והפעם, הרשימה ארוכה במיוחד:</span></div>
<div id="cap203" class="clip cap" data-start="525.400" data-duration="1.833" data-track-index="1"><span id="cap203-t" class="cap-t">תשעה שיעורים חדשים.</span></div>
<div id="cap204" class="clip cap" data-start="604.467" data-duration="2.033" data-track-index="1"><span id="cap204-t" class="cap-t">תשעה-עשר שיעורים.</span></div>
<div id="cap205" class="clip cap" data-start="606.500" data-duration="2.567" data-track-index="1"><span id="cap205-t" class="cap-t">הסגן כבר מרגיש מומחה.</span></div>
<div id="cap206" class="clip cap" data-start="609.067" data-duration="1.567" data-track-index="1"><span id="cap206-t" class="cap-t">ובכל הספרים כתוב:</span></div>
<div id="cap207" class="clip cap" data-start="610.633" data-duration="1.533" data-track-index="1"><span id="cap207-t" class="cap-t">״תפוס את הגבעה הגבוהה,</span></div>
<div id="cap208" class="clip cap" data-start="612.167" data-duration="1.733" data-track-index="1"><span id="cap208-t" class="cap-t">זו שחולשת על השטח.״</span></div>
<div id="cap209" class="clip cap" data-start="613.900" data-duration="2.667" data-track-index="1"><span id="cap209-t" class="cap-t">אז הוא עולה לראש גבעת המכשלה.</span></div>
<div id="cap210" class="clip cap" data-start="616.567" data-duration="2.767" data-track-index="1"><span id="cap210-t" class="cap-t">משם רואים קילומטרים לכל כיוון.</span></div>
<div id="cap211" class="clip cap" data-start="619.333" data-duration="2.067" data-track-index="1"><span id="cap211-t" class="cap-t">הוא חופר עשר חפירות קצרות ועמוקות</span></div>
<div id="cap212" class="clip cap" data-start="621.400" data-duration="2.233" data-track-index="1"><span id="cap212-t" class="cap-t">מסביב לבקתות של הכפר.</span></div>
<div id="cap213" class="clip cap" data-start="623.633" data-duration="1.600" data-track-index="1"><span id="cap213-t" class="cap-t">הגנה היקפית מלאה,</span></div>
<div id="cap214" class="clip cap" data-start="625.233" data-duration="1.267" data-track-index="1"><span id="cap214-t" class="cap-t">מוסתרת היטב,</span></div>
<div id="cap215" class="clip cap" data-start="626.500" data-duration="2.233" data-track-index="1"><span id="cap215-t" class="cap-t">עם תעלות קשר ביניהן.</span></div>
<div id="cap216" class="clip cap" data-start="628.733" data-duration="1.367" data-track-index="1"><span id="cap216-t" class="cap-t">את כל המקומיים,</span></div>
<div id="cap217" class="clip cap" data-start="630.100" data-duration="1.500" data-track-index="1"><span id="cap217-t" class="cap-t">הוא אוסף לבקתות.</span></div>
<div id="cap218" class="clip cap" data-start="631.600" data-duration="3.733" data-track-index="1"><span id="cap218-t" class="cap-t">בבוקר, הבורים מגיעים ומקיפים את הגבעה.</span></div>
<div id="cap219" class="clip cap" data-start="635.333" data-duration="0.967" data-track-index="1"><span id="cap219-t" class="cap-t">הם יורים,</span></div>
<div id="cap220" class="clip cap" data-start="636.300" data-duration="2.267" data-track-index="1"><span id="cap220-t" class="cap-t">אבל לא מצליחים להתקרב.</span></div>
<div id="cap221" class="clip cap" data-start="638.567" data-duration="1.433" data-track-index="1"><span id="cap221-t" class="cap-t">העמדה מצוינת.</span></div>
<div id="cap222" class="clip cap" data-start="640.000" data-duration="2.500" data-track-index="1"><span id="cap222-t" class="cap-t">ואז הסגן מגלה בעיה.</span></div>
<div id="cap223" class="clip cap" data-start="642.500" data-duration="1.500" data-track-index="1"><span id="cap223-t" class="cap-t">מהחפירות למעלה,</span></div>
<div id="cap224" class="clip cap" data-start="644.000" data-duration="2.233" data-track-index="1"><span id="cap224-t" class="cap-t">אי אפשר בכלל לראות את המעבר.</span></div>
<div id="cap225" class="clip cap" data-start="646.233" data-duration="1.800" data-track-index="1"><span id="cap225-t" class="cap-t">המדרון של הגבעה מעוגל,</span></div>
<div id="cap226" class="clip cap" data-start="648.033" data-duration="1.900" data-track-index="1"><span id="cap226-t" class="cap-t">כמו גב של כדור.</span></div>
<div id="cap227" class="clip cap" data-start="649.933" data-duration="2.167" data-track-index="1"><span id="cap227-t" class="cap-t">ומאחורי העיקול נוצר ״שטח מת״:</span></div>
<div id="cap228" class="clip cap" data-start="652.100" data-duration="1.600" data-track-index="1"><span id="cap228-t" class="cap-t">אזור שאי אפשר לראות,</span></div>
<div id="cap229" class="clip cap" data-start="653.700" data-duration="1.700" data-track-index="1"><span id="cap229-t" class="cap-t">ואי אפשר לירות אליו.</span></div>
<div id="cap230" class="clip cap" data-start="655.400" data-duration="2.567" data-track-index="1"><span id="cap230-t" class="cap-t">והמעבר, והדרך שמובילה אליו,</span></div>
<div id="cap231" class="clip cap" data-start="657.967" data-duration="1.900" data-track-index="1"><span id="cap231-t" class="cap-t">נמצאים בדיוק בשטח המת.</span></div>
<div id="cap232" class="clip cap" data-start="659.867" data-duration="2.800" data-track-index="1"><span id="cap232-t" class="cap-t">וכך, בזמן שהסגן ואנשיו יושבים בבטחה</span></div>
<div id="cap233" class="clip cap" data-start="662.667" data-duration="0.900" data-track-index="1"><span id="cap233-t" class="cap-t">על הגבעה,</span></div>
<div id="cap234" class="clip cap" data-start="663.567" data-duration="2.333" data-track-index="1"><span id="cap234-t" class="cap-t">השיירה הבורית חוצה את המעבר בשקט,</span></div>
<div id="cap235" class="clip cap" data-start="665.900" data-duration="1.367" data-track-index="1"><span id="cap235-t" class="cap-t">וממשיכה דרומה.</span></div>
<div id="cap236" class="clip cap" data-start="667.267" data-duration="1.167" data-track-index="1"><span id="cap236-t" class="cap-t">הם לא נכנעו,</span></div>
<div id="cap237" class="clip cap" data-start="668.433" data-duration="2.333" data-track-index="1"><span id="cap237-t" class="cap-t">וכמעט לא היו נפגעים.</span></div>
<div id="cap238" class="clip cap" data-start="670.767" data-duration="1.100" data-track-index="1"><span id="cap238-t" class="cap-t">אבל המשימה,</span></div>
<div id="cap239" class="clip cap" data-start="671.867" data-duration="1.367" data-track-index="1"><span id="cap239-t" class="cap-t">להחזיק את המעבר,</span></div>
<div id="cap240" class="clip cap" data-start="673.233" data-duration="1.333" data-track-index="1"><span id="cap240-t" class="cap-t">נכשלה לגמרי.</span></div>
<div id="cap241" class="clip cap" data-start="674.567" data-duration="2.333" data-track-index="1"><span id="cap241-t" class="cap-t">והסגן כבר שומע את הקולונל שלו:</span></div>
<div id="cap242" class="clip cap" data-start="676.900" data-duration="3.100" data-track-index="1"><span id="cap242-t" class="cap-t">״מה?! אתה מתכוון לומר לי</span></div>
<div id="cap243" class="clip cap" data-start="680.000" data-duration="2.000" data-track-index="1"><span id="cap243-t" class="cap-t">שהבורים צלחו את המעבר?!״</span></div>
<div id="cap244" class="clip cap" data-start="713.833" data-duration="2.233" data-track-index="1"><span id="cap244-t" class="cap-t">עשרים ושניים שיעורים.</span></div>
<div id="cap245" class="clip cap" data-start="716.067" data-duration="1.933" data-track-index="1"><span id="cap245-t" class="cap-t">הסגן עומד שוב על הגבעה,</span></div>
<div id="cap246" class="clip cap" data-start="718.000" data-duration="1.933" data-track-index="1"><span id="cap246-t" class="cap-t">ומחפש את המקום המושלם.</span></div>
<div id="cap247" class="clip cap" data-start="719.933" data-duration="2.100" data-track-index="1"><span id="cap247-t" class="cap-t">ואז עולה בראשו רעיון משוגע,</span></div>
<div id="cap248" class="clip cap" data-start="722.033" data-duration="1.700" data-track-index="1"><span id="cap248-t" class="cap-t">שנוגד את כל מה שלמד:</span></div>
<div id="cap249" class="clip cap" data-start="723.733" data-duration="1.300" data-track-index="1"><span id="cap249-t" class="cap-t">לא לעלות למעלה,</span></div>
<div id="cap250" class="clip cap" data-start="725.033" data-duration="1.933" data-track-index="1"><span id="cap250-t" class="cap-t">אלא לרדת למטה.</span></div>
<div id="cap251" class="clip cap" data-start="726.967" data-duration="2.167" data-track-index="1"><span id="cap251-t" class="cap-t">להחזיק בתוך אפיק הנהר עצמו,</span></div>
<div id="cap252" class="clip cap" data-start="729.133" data-duration="1.667" data-track-index="1"><span id="cap252-t" class="cap-t">משני צידי המעבר.</span></div>
<div id="cap253" class="clip cap" data-start="730.800" data-duration="2.500" data-track-index="1"><span id="cap253-t" class="cap-t">הגדות הגבוהות יסתירו אותו מכל עין,</span></div>
<div id="cap254" class="clip cap" data-start="733.300" data-duration="1.867" data-track-index="1"><span id="cap254-t" class="cap-t">והמים קרובים.</span></div>
<div id="cap255" class="clip cap" data-start="735.167" data-duration="1.333" data-track-index="1"><span id="cap255-t" class="cap-t">ומה שהכי חשוב:</span></div>
<div id="cap256" class="clip cap" data-start="736.500" data-duration="1.900" data-track-index="1"><span id="cap256-t" class="cap-t">כל מי שירצה להגיע למעבר,</span></div>
<div id="cap257" class="clip cap" data-start="738.400" data-duration="2.300" data-track-index="1"><span id="cap257-t" class="cap-t">יצטרך לחצות שטח פתוח וחשוף,</span></div>
<div id="cap258" class="clip cap" data-start="740.700" data-duration="1.567" data-track-index="1"><span id="cap258-t" class="cap-t">ישר מול הרובים שלו.</span></div>
<div id="cap259" class="clip cap" data-start="742.267" data-duration="1.233" data-track-index="1"><span id="cap259-t" class="cap-t">אז קודם כול,</span></div>
<div id="cap260" class="clip cap" data-start="743.500" data-duration="1.767" data-track-index="1"><span id="cap260-t" class="cap-t">אוספים את כולם.</span></div>
<div id="cap261" class="clip cap" data-start="745.267" data-duration="1.833" data-track-index="1"><span id="cap261-t" class="cap-t">גברים, נשים,</span></div>
<div id="cap262" class="clip cap" data-start="747.100" data-duration="2.300" data-track-index="1"><span id="cap262-t" class="cap-t">ילדים, ואפילו העגלות.</span></div>
<div id="cap263" class="clip cap" data-start="749.400" data-duration="2.267" data-track-index="1"><span id="cap263-t" class="cap-t">לאורך הגדות חופרים שוחות קטנות,</span></div>
<div id="cap264" class="clip cap" data-start="751.667" data-duration="2.333" data-track-index="1"><span id="cap264-t" class="cap-t">לשניים או שלושה חיילים כל אחת,</span></div>
<div id="cap265" class="clip cap" data-start="754.000" data-duration="2.033" data-track-index="1"><span id="cap265-t" class="cap-t">מוסתרות בין השיחים.</span></div>
<div id="cap266" class="clip cap" data-start="756.033" data-duration="2.367" data-track-index="1"><span id="cap266-t" class="cap-t">את השיחים שמלפנים גוזמים בזהירות,</span></div>
<div id="cap267" class="clip cap" data-start="758.400" data-duration="2.167" data-track-index="1"><span id="cap267-t" class="cap-t">כדי לפנות שדה אש בלי לחשוף</span></div>
<div id="cap268" class="clip cap" data-start="760.567" data-duration="0.933" data-track-index="1"><span id="cap268-t" class="cap-t">את העמדה.</span></div>
<div id="cap269" class="clip cap" data-start="761.500" data-duration="1.833" data-track-index="1"><span id="cap269-t" class="cap-t">על ראש גבעת המכשלה מוצבת חוליה</span></div>
<div id="cap270" class="clip cap" data-start="763.333" data-duration="1.367" data-track-index="1"><span id="cap270-t" class="cap-t">קטנה ומוסתרת,</span></div>
<div id="cap271" class="clip cap" data-start="764.700" data-duration="1.600" data-track-index="1"><span id="cap271-t" class="cap-t">כדי שהאויב לא יוכל לתפוס את</span></div>
<div id="cap272" class="clip cap" data-start="766.300" data-duration="1.700" data-track-index="1"><span id="cap272-t" class="cap-t">הגבעה ולירות משם.</span></div>
<div id="cap273" class="clip cap" data-start="768.000" data-duration="1.333" data-track-index="1"><span id="cap273-t" class="cap-t">ובשטח הפתוח,</span></div>
<div id="cap274" class="clip cap" data-start="769.333" data-duration="2.033" data-track-index="1"><span id="cap274-t" class="cap-t">הטריק: חפירות דמה,</span></div>
<div id="cap275" class="clip cap" data-start="771.367" data-duration="1.867" data-track-index="1"><span id="cap275-t" class="cap-t">עם שקי חול לבנים וחדשים,</span></div>
<div id="cap276" class="clip cap" data-start="773.233" data-duration="2.133" data-track-index="1"><span id="cap276-t" class="cap-t">שנראים מקילומטרים.</span></div>
<div id="cap277" class="clip cap" data-start="775.367" data-duration="1.467" data-track-index="1"><span id="cap277-t" class="cap-t">מלכודת לעין.</span></div>
<div id="cap278" class="clip cap" data-start="776.833" data-duration="1.467" data-track-index="1"><span id="cap278-t" class="cap-t">וההוראה לחיילים:</span></div>
<div id="cap279" class="clip cap" data-start="778.300" data-duration="1.300" data-track-index="1"><span id="cap279-t" class="cap-t">לא יורים אף כדור,</span></div>
<div id="cap280" class="clip cap" data-start="779.600" data-duration="2.200" data-track-index="1"><span id="cap280-t" class="cap-t">עד שהאויב ממש קרוב.</span></div>
<div id="cap281" class="clip cap" data-start="781.800" data-duration="1.967" data-track-index="1"><span id="cap281-t" class="cap-t">כולם מחכים לשריקה.</span></div>
<div id="cap282" class="clip cap" data-start="783.767" data-duration="2.500" data-track-index="1"><span id="cap282-t" class="cap-t">בבוקר מופיעים הבורים.</span></div>
<div id="cap283" class="clip cap" data-start="786.267" data-duration="3.000" data-track-index="1"><span id="cap283-t" class="cap-t">סיירים מתקרבים בזהירות למעבר.</span></div>
<div id="cap284" class="clip cap" data-start="789.267" data-duration="1.467" data-track-index="1"><span id="cap284-t" class="cap-t">הם לא רואים כלום.</span></div>
<div id="cap285" class="clip cap" data-start="790.733" data-duration="2.167" data-track-index="1"><span id="cap285-t" class="cap-t">ואז: אש!</span></div>
<div id="cap286" class="clip cap" data-start="792.900" data-duration="1.200" data-track-index="1"><span id="cap286-t" class="cap-t">מכל השוחות,</span></div>
<div id="cap287" class="clip cap" data-start="794.100" data-duration="1.633" data-track-index="1"><span id="cap287-t" class="cap-t">בבת אחת.</span></div>
<div id="cap288" class="clip cap" data-start="795.733" data-duration="1.833" data-track-index="1"><span id="cap288-t" class="cap-t">הבורים מופתעים לגמרי,</span></div>
<div id="cap289" class="clip cap" data-start="797.567" data-duration="1.400" data-track-index="1"><span id="cap289-t" class="cap-t">ונסוגים במהירות.</span></div>
<div id="cap290" class="clip cap" data-start="798.967" data-duration="1.500" data-track-index="1"><span id="cap290-t" class="cap-t">הם מביאים תותחים,</span></div>
<div id="cap291" class="clip cap" data-start="800.467" data-duration="2.267" data-track-index="1"><span id="cap291-t" class="cap-t">ומפגיזים בכל הכוח...</span></div>

<div id="cap297" class="clip cap" data-start="810.633" data-duration="1.000" data-track-index="1"><span id="cap297-t" class="cap-t">יום שלם,</span></div>
<div id="cap298" class="clip cap" data-start="811.633" data-duration="1.167" data-track-index="1"><span id="cap298-t" class="cap-t">ולילה שלם,</span></div>
<div id="cap299" class="clip cap" data-start="812.800" data-duration="2.167" data-track-index="1"><span id="cap299-t" class="cap-t">הם מנסים שוב ושוב.</span></div>
<div id="cap300" class="clip cap" data-start="814.967" data-duration="2.767" data-track-index="1"><span id="cap300-t" class="cap-t">והמעבר נשאר בידיים של הסגן.</span></div>
<div id="cap301" class="clip cap" data-start="817.733" data-duration="1.533" data-track-index="1"><span id="cap301-t" class="cap-t">ובבוקר שאחרי,</span></div>
<div id="cap302" class="clip cap" data-start="819.267" data-duration="2.267" data-track-index="1"><span id="cap302-t" class="cap-t">רעם של תותחים מרחוק.</span></div>
<div id="cap303" class="clip cap" data-start="821.533" data-duration="2.400" data-track-index="1"><span id="cap303-t" class="cap-t">השיירה הבריטית מגיעה.</span></div>
<div id="cap304" class="clip cap" data-start="823.933" data-duration="1.500" data-track-index="1"><span id="cap304-t" class="cap-t">המשימה הושלמה!</span></div>
<div id="cap305" class="clip cap" data-start="825.433" data-duration="1.300" data-track-index="1"><span id="cap305-t" class="cap-t">המחיר היה כבד:</span></div>

<div id="cap307" class="clip cap" data-start="828.033" data-duration="2.067" data-track-index="1"><span id="cap307-t" class="cap-t">וחמישה-עשר פצועים.</span></div>
<div id="cap308" class="clip cap" data-start="830.100" data-duration="1.133" data-track-index="1"><span id="cap308-t" class="cap-t">אבל המעבר,</span></div>

<div id="cap310" class="clip cap" data-start="834.000" data-duration="1.933" data-track-index="1"><span id="cap310-t" class="cap-t">הסגן כבר שומע את התזמורת,</span></div>
<div id="cap311" class="clip cap" data-start="835.933" data-duration="1.333" data-track-index="1"><span id="cap311-t" class="cap-t">את מחיאות הכפיים,</span></div>
<div id="cap312" class="clip cap" data-start="837.267" data-duration="1.600" data-track-index="1"><span id="cap312-t" class="cap-t">ואת הקולונל אומר לו:</span></div>
<div id="cap313" class="clip cap" data-start="838.867" data-duration="1.100" data-track-index="1"><span id="cap313-t" class="cap-t">״קום על רגליך,</span></div>
<div id="cap314" class="clip cap" data-start="839.967" data-duration="1.367" data-track-index="1"><span id="cap314-t" class="cap-t">האביר תכנוני.״</span></div>
<div id="cap315" class="clip cap" data-start="841.333" data-duration="2.700" data-track-index="1"><span id="cap315-t" class="cap-t">ופתאום, הקול משתנה...</span></div>
<div id="cap316" class="clip cap" data-start="844.033" data-duration="4.533" data-track-index="1"><span id="cap316-t" class="cap-t">״המפקד! הגיע הזמן לארוז את החפצים.</span></div>

<div id="cap318" class="clip cap" data-start="850.667" data-duration="2.067" data-track-index="1"><span id="cap318-t" class="cap-t">הוא פוקח את העיניים.</span></div>
<div id="cap319" class="clip cap" data-start="852.733" data-duration="2.200" data-track-index="1"><span id="cap319-t" class="cap-t">הוא עדיין שוכב באותו חור מאובק,</span></div>
<div id="cap320" class="clip cap" data-start="854.933" data-duration="1.800" data-track-index="1"><span id="cap320-t" class="cap-t">בכפר החלומות.</span></div>

<div id="cap324" class="clip cap" data-start="865.800" data-duration="2.867" data-track-index="1"><span id="cap324-t" class="cap-t">אפשר לסכם את זה בשישה רעיונות גדולים.</span></div>

<div id="cap328" class="clip cap" data-start="874.067" data-duration="2.500" data-track-index="1"><span id="cap328-t" class="cap-t">שתיים: כל מקומי שרואה אותך,</span></div>
